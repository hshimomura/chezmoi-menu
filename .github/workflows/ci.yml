name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: swift --version
      - name: Install chezmoi
        run: brew install chezmoi
      - name: Test isolated sync and API requests
        run: swift test --disable-sandbox
      - name: Check shell syntax
        run: bash -n scripts/build-app.sh scripts/build-icons.sh scripts/package-release.sh
      - name: Test notarization credential loading
        run: python3 -m unittest discover -s Tests/DistributionTests
      - name: Build app and verify signature
        run: |
          bash scripts/build-app.sh --universal
          architectures=" $(lipo -archs 'dist/Chezmoi Menu.app/Contents/MacOS/ChezmoiMenu') "
          [[ "$architectures" == *" arm64 "* && "$architectures" == *" x86_64 "* ]]
          codesign --verify --strict "dist/Chezmoi Menu.app"
          plutil -lint "dist/Chezmoi Menu.app/Contents/Info.plist"
